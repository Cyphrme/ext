[package]
name = "ext"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "ext"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
data-encoding = "2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
json5 = "1.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
assert_cmd = "2"
# Cross-check the virtual-filesystem magic numbers against independent tables.
libc = "0.2"
linux-raw-sys = "0.12"
