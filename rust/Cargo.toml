[package]
name = "ext"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
sha2 = "0.10"
data-encoding = "2"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
